# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# =================================================================
# ★ JVM / Daemon 설정
# -Xms: 시작 메모리 (크게 잡아야 GC 횟수 줄어듦)
# -Xmx: 최대 메모리
# G1GC: 대용량 힙에서 ParallelGC보다 훨씬 빠름
# -XX:+HeapDumpOnOutOfMemoryError: OOM 발생 시 덤프 생성
# =================================================================
org.gradle.jvmargs=-Xms2g -Xmx4g -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=200 -Dfile.encoding=UTF-8

# Gradle Daemon 활성화 (기본값이지만 명시적으로 지정)
org.gradle.daemon=true

# =================================================================
# ★ 빌드 병렬화 / 캐싱
# =================================================================
# 모듈 병렬 빌드
org.gradle.parallel=true

# Gradle 빌드 캐시 (이전 빌드 결과 재사용)
org.gradle.caching=true

# Configuration Cache: task 그래프 계산 결과를 캐싱 → 설정 단계 거의 생략 (가장 효과 큼)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# 필요한 프로젝트만 설정 (단일 모듈이지만 소폭 도움)
org.gradle.configureondemand=true

# =================================================================
# ★ Kotlin 컴파일러 최적화
# =================================================================
# Kotlin 증분 컴파일 (변경된 파일만 재컴파일)
kotlin.incremental=true

# Kotlin Daemon 재사용 (매 빌드마다 새 Daemon 생성 방지)
kotlin.daemon.jvm.options=-Xmx2g -XX:+UseG1GC

# =================================================================
# ★ KSP (Hilt, Serialization) 최적화
# =================================================================
ksp.incremental=true
ksp.incremental.log=false

# =================================================================
# ★ Compose 컴파일러 최적화
# =================================================================
# 변경되지 않은 Composable 재컴파일 방지 (증분 빌드 속도 개선)
kotlin.incremental.useClasspathSnapshot=true

# =================================================================
# ★ Android 기타 설정
# =================================================================
android.suppressUnsupportedCompileSdk=35
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
