name: SeatNow Play Store Deployment

on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 푸시될 때 자동 실행
  workflow_dispatch: # GitHub 웹 화면에서 수동으로 버튼을 눌러 실행할 수 있는 옵션

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코드 가져오기 (Checkout)
        uses: actions/checkout@v4

      - name: 2. Java 17 설정 (Kotlin 빌드 환경 세팅)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 3. 시스템 환경 변수 세팅 (local.properties 생성 및 키스토어 복원)
        run: |
          # 네이버/카카오 키 세팅 (Github Secrets에 등록 필요!)
          echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> local.properties
          echo "KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}" >> local.properties
          
          # Gradle 빌드 중 signingConfigs 에러를 막기 위해 임시로 진짜 JKS를 구성합니다.
          echo "STORE_FILE=keystore.jks" >> local.properties
          echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties
          
          # 베이스64 키스토어 값을 실제 파일로 디코딩
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: 4. Gradle 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 5. 단위 테스트 실행 (Clean Architecture 계층 안정성 검증)
        run: ./gradlew testReleaseUnitTest

      - name: 6. 릴리즈용 AAB(App Bundle) 생성
        run: ./gradlew bundleRelease

      - name: 7. 구글 플레이스토어에 자동 업로드
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.gmg.seatnow
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
